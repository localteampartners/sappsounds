name: release-builds

# Builds the SappSounds developer tools (SFZ validator, instrument
# inspector, render tool) for macOS (universal) and Windows and attaches
# the zips to the GitHub release for the given tag. SappSounds itself is a
# source library — the Sapp instrument releases carry the VST builds.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach builds to (e.g. v0.3.2)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DSAPPSOUNDS_BUILD_TESTS=OFF -DSAPPSOUNDS_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build build --config Release -j3
      - name: Package
        run: |
          STAGE="SappSounds-tools-$TAG-macOS-universal"
          mkdir -p "$STAGE"
          cp build/SappSoundsSFZValidator build/SappSoundsInstrumentInspector build/SappSoundsRenderTool "$STAGE/"
          cp scripts/fetch-library.sh "$STAGE/"
          {
            echo "SappSounds $TAG - engine developer tools (macOS universal)"
            echo ''
            echo 'SappSoundsSFZValidator <f.sfz> [--json]      validate an SFZ instrument'
            echo 'SappSoundsInstrumentInspector <f.sfz>        JSON capability report'
            echo 'SappSoundsRenderTool --sfz f --midi m --out w.wav   deterministic render'
            echo 'fetch-library.sh list|get <name|all>         download free sample libraries'
          } > "$STAGE/README.txt"
          zip -qry "$STAGE.zip" "$STAGE"
      - name: Upload to release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" "SappSounds-tools-$TAG-macOS-universal.zip" --clobber

  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DSAPPSOUNDS_BUILD_TESTS=OFF -DSAPPSOUNDS_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          $stage = "SappSounds-tools-$env:TAG-Windows-x64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item build/Release/SappSoundsSFZValidator.exe "$stage/"
          Copy-Item build/Release/SappSoundsInstrumentInspector.exe "$stage/"
          Copy-Item build/Release/SappSoundsRenderTool.exe "$stage/"
          Copy-Item scripts/fetch-library.sh "$stage/"
          Set-Content -Path "$stage/README.txt" -Value @(
            "SappSounds $env:TAG - engine developer tools (Windows x64)",
            '',
            'SappSoundsSFZValidator.exe <f.sfz> [--json]      validate an SFZ instrument',
            'SappSoundsInstrumentInspector.exe <f.sfz>        JSON capability report',
            'SappSoundsRenderTool.exe --sfz f --midi m --out w.wav   deterministic render',
            'fetch-library.sh works via Git Bash / WSL.'
          )
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
      - name: Upload to release
        shell: pwsh
        run: |
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "$env:TAG" --generate-notes }
          gh release upload "$env:TAG" "SappSounds-tools-$env:TAG-Windows-x64.zip" --clobber
