name: release-builds

# Builds the SappSounds developer tools (SFZ validator, instrument
# inspector, render tool) for Windows and attaches the zip to the GitHub
# release for the given tag. Windows-only by design — the Sapp products
# ship Windows VSTs; macOS builds are made locally when needed. SappSounds itself is a
# source library — the Sapp instrument releases carry the VST builds.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach builds to (e.g. v0.3.2)"
        required: true

permissions:
  contents: write

jobs:

  windows:
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DSAPPSOUNDS_BUILD_TESTS=OFF -DSAPPSOUNDS_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: powershell
        run: |
          $stage = "SappSounds-tools-$env:TAG-Windows-x64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item build/Release/SappSoundsSFZValidator.exe "$stage/"
          Copy-Item build/Release/SappSoundsInstrumentInspector.exe "$stage/"
          Copy-Item build/Release/SappSoundsRenderTool.exe "$stage/"
          Copy-Item scripts/fetch-library.sh "$stage/"
          Set-Content -Path "$stage/README.txt" -Value @(
            "SappSounds $env:TAG - engine developer tools (Windows x64)",
            '',
            'SappSoundsSFZValidator.exe <f.sfz> [--json]      validate an SFZ instrument',
            'SappSoundsInstrumentInspector.exe <f.sfz>        JSON capability report',
            'SappSoundsRenderTool.exe --sfz f --midi m --out w.wav   deterministic render',
            'fetch-library.sh works via Git Bash / WSL.'
          )
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
      - name: Upload to release
        shell: powershell
        run: |
          # gh writes "release not found" to stderr, and Windows PowerShell turns
          # native stderr into a terminating error under ErrorActionPreference=Stop
          # (pwsh 7 on hosted runners does not) - so soften it around the probe.
          $ErrorActionPreference = "Continue"
          gh release view "$env:TAG" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create "$env:TAG" --generate-notes }
          $ErrorActionPreference = "Stop"
          gh release upload "$env:TAG" "SappSounds-tools-$env:TAG-Windows-x64.zip" --clobber

  # THE GUARD. sapptune v0.28.0 once shipped with no plugin: the build passed,
  # a later step failed, the upload was skipped, and the release looked green.
  # A tag must never exist without its binary.
  verify-release-assets:
    needs: windows
    if: always() && (inputs.tag != '' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: The release must carry its build
        shell: bash
        run: |
          assets=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(" ")' 2>/dev/null || echo "")
          echo "assets on $TAG: ${assets:-<none>}"
          case "$assets" in
            *Windows-x64*) echo "OK - the build is attached." ;;
            *) echo "::error::$TAG has no Windows-x64 asset - the build or upload did not complete."
               exit 1 ;;
          esac
